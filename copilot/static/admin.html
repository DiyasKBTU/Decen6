<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --line: #e6e3dc; --line-strong: #d6d2c8;
    --text: #1f2328; --muted: #6b6f76; --faint: #9a9da3;
    --accent: #0f6b5c; --accent-soft: #e4f1ed; --accent-text: #ffffff;
    --danger: #b42318; --danger-soft: #fbeceb; --ok: #13795b;
    --p0: #b42318; --p1: #b25e09; --p2: #35598a; --p3: #8a8f98;
    --quote: #f1efe9; --radius: 8px;
    --font: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a; --panel: #1c1f23; --line: #2a2e34; --line-strong: #383d44;
      --text: #e7e7e4; --muted: #9aa0a6; --faint: #6f747b;
      --accent: #4fb39f; --accent-soft: #1d302b; --accent-text: #0e1513;
      --danger: #f0786d; --danger-soft: #3a2120; --ok: #5cc39f;
      --p0: #f0786d; --p1: #e0a159; --p2: #8fb0dd; --p3: #8a8f98; --quote: #23272c;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); font-variant-numeric: tabular-nums; }
  button, input, select, textarea { font: inherit; color: inherit; }

  header { height: 52px; display: flex; align-items: center; gap: 28px; padding: 0 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 600; }
  nav { display: flex; gap: 20px; height: 100%; }
  nav button { background: none; border: 0; padding: 0; height: 100%; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 500; }
  nav .count { color: var(--faint); margin-left: 4px; }
  .spacer { flex: 1; }
  #citedText { margin: 8px 0 0; }

  .btn { border: 1px solid var(--line-strong); background: var(--panel); border-radius: var(--radius); padding: 7px 14px; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 500; }
  .btn.primary:hover { filter: brightness(1.05); }
  .link { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-strong); }
  .link:hover { color: var(--text); }
  .link.danger { color: var(--danger); }

  .layout { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; height: calc(100vh - 52px); }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .filters { padding: 12px 14px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
  .segmented { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; width: fit-content; }
  .segmented button { background: none; border: 0; padding: 5px 14px; cursor: pointer; color: var(--muted); }
  .segmented button.active { background: var(--accent-soft); color: var(--text); font-weight: 500; }
  input[type=search], input[type=text], input[type=number], select, textarea { border: 1px solid var(--line-strong); background: var(--panel); border-radius: var(--radius); padding: 7px 10px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

  #queue { overflow-y: auto; flex: 1; }
  .item { padding: 11px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: var(--bg); }
  .item.selected { background: var(--accent-soft); }
  .item .row1 { display: flex; align-items: baseline; gap: 8px; }
  .item .cat { font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .time { color: var(--faint); font-size: 12.5px; white-space: nowrap; }
  .item .row2 { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .item .note { font-size: 12.5px; margin-top: 3px; }
  .note.ok { color: var(--ok); } .note.dup { color: var(--danger); }
  .prio { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .prio::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
  .prio.p0 { color: var(--p0); } .prio.p1 { color: var(--p1); } .prio.p2 { color: var(--p2); } .prio.p3 { color: var(--p3); }
  .empty { padding: 48px 24px; text-align: center; color: var(--muted); }

  #detail { overflow-y: auto; min-height: 0; }
  .sheet { max-width: 820px; margin: 0 auto; padding: 24px 28px 64px; }
  .sheet h2 { font-size: 20px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sub { color: var(--muted); margin-top: 4px; }
  .edit-decision { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  section.block { margin-top: 26px; }
  .label { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .quote { background: var(--quote); border-left: 3px solid var(--line-strong); padding: 10px 14px; border-radius: 0 var(--radius) var(--radius) 0; white-space: pre-wrap; word-break: break-word; }
  .quote + .quote { margin-top: 8px; }
  .quote .who { display: block; color: var(--muted); font-size: 12.5px; margin-bottom: 2px; }
  textarea { width: 100%; min-height: 150px; resize: vertical; line-height: 1.55; }
  textarea.edited { border-color: var(--p1); }
  .refs { margin-top: 8px; color: var(--muted); font-size: 13px; }
  .ref { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 500; }
  .warn { color: var(--danger); font-size: 13px; margin-top: 6px; }
  .actions { display: flex; align-items: center; gap: 18px; margin-top: 14px; flex-wrap: wrap; }
  .hint { color: var(--faint); font-size: 12.5px; }
  .escalate { display: flex; gap: 10px; margin-top: 12px; }
  .escalate input { flex: 1; }

  .evidence { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
  .evidence .part { padding: 12px 16px; }
  .evidence .part + .part { border-top: 1px solid var(--line); }
  .rule-row { display: grid; grid-template-columns: 70px 1fr auto; gap: 12px; align-items: baseline; padding: 4px 0; }
  .rule-row .id { font-weight: 500; }
  .rule-row .why { color: var(--muted); font-size: 13px; }
  .rule-row .tag { font-size: 12px; color: var(--ok); white-space: nowrap; }
  .rule-row .tag.off { color: var(--faint); }
  .rule-text { margin: 6px 0 4px 82px; font-size: 13px; color: var(--muted); white-space: pre-wrap; }
  .example { font-size: 13px; padding: 4px 0; }
  .example .q { color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); }
  details[open] summary { margin-bottom: 8px; }
  ul.plain { margin: 0; padding-left: 18px; color: var(--muted); }

  .tpl-wrap { max-width: 860px; margin: 0 auto; padding: 24px 28px 64px; }
  .tpl-intro { color: var(--muted); margin: 0 0 18px; }
  .tpl { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; }
  .tpl h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .tpl .stat { color: var(--muted); font-size: 13px; }
  .tpl .said { margin: 10px 0; color: var(--muted); }
  .tpl .said q { color: var(--text); }
  .tpl textarea { min-height: 76px; }
  .tpl .status-accepted { color: var(--ok); font-weight: 500; }
  .tpl .status-rejected { color: var(--faint); }

  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(560px, calc(100vw - 32px)); background: var(--panel); color: var(--text); box-shadow: 0 20px 50px rgba(0,0,0,.18); }
  dialog::backdrop { background: rgba(20, 22, 25, .35); }
  dialog form { padding: 20px 22px; display: grid; gap: 14px; }
  dialog h3 { margin: 0; font-size: 17px; font-weight: 600; }
  dialog .grid2 { display: grid; grid-template-columns: 1fr 120px; gap: 10px; }
  dialog label { display: grid; gap: 5px; color: var(--muted); font-size: 13px; min-width: 0; }
  dialog input, dialog textarea { width: 100%; min-width: 0; }
  dialog textarea { min-height: 110px; color: var(--text); }
  dialog .foot { display: flex; justify-content: flex-end; gap: 12px; align-items: center; }

  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--panel); padding: 9px 16px; border-radius: var(--radius); opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: .95; }

  @media (max-width: 860px) {
    header { gap: 16px; padding: 0 14px; }
    .layout { grid-template-columns: 1fr; height: auto; }
    aside { max-height: 48vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .sheet, .tpl-wrap { padding: 18px 16px 48px; }
    .rule-row { grid-template-columns: 60px 1fr; } .rule-row .tag { grid-column: 2; }
    .rule-text { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <span class="brand">Support Copilot</span>
  <nav id="nav">
    <button data-view="queue" class="active">Очередь<span class="count" id="queueCount"></span></button>
    <button data-view="templates">Шаблоны<span class="count" id="tplCount"></span></button>
  </nav>
  <span class="spacer"></span>
  <button class="btn" id="newTicketBtn">Новое обращение</button>
</header>

<div class="layout" id="queueView">
  <aside>
    <div class="filters">
      <div class="segmented" id="statusFilter">
        <button data-status="new" class="active">Новые</button>
        <button data-status="done">Обработанные</button>
      </div>
      <input type="search" id="search" placeholder="Поиск по тексту">
    </div>
    <div id="queue"></div>
  </aside>
  <main id="detail"><div class="empty">Выберите обращение</div></main>
</div>

<div id="templatesView" hidden>
  <div class="tpl-wrap">
    <p class="tpl-intro" id="tplIntro"></p>
    <div id="tplList"></div>
  </div>
</div>

<dialog id="newTicket">
  <form method="dialog" id="newTicketForm">
    <h3>Новое обращение</h3>
    <div class="segmented" id="kindPick">
      <button type="button" data-kind="complaint" class="active">Жалоба</button>
      <button type="button" data-kind="report">Репорт из игры</button>
    </div>
    <label>Текст игрока<textarea id="ntText" required placeholder="Например: Arman_Petrov убил меня в зз у банка, скрины есть"></textarea></label>
    <div class="grid2" id="complaintFields">
      <label>Ник обвиняемого<input type="text" id="ntNick" placeholder="Arman_Petrov"></label>
      <label>Скриншотов<input type="number" id="ntImages" min="0" value="1"></label>
    </div>
    <div class="foot">
      <button type="button" class="link" id="ntCancel">Отмена</button>
      <button type="submit" class="btn primary">Разобрать</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<script>
const $ = (s, root = document) => root.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const KIND = { complaint: "Жалоба", report: "Репорт" };
const state = { status: "new", items: [], selected: null, ticket: null, meta: null, catTitle: {}, kind: "complaint" };

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}
function toast(text) { const t = $("#toast"); t.textContent = text; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2000); }
function when(s) {
  if (!s) return "";
  const d = new Date(s);
  return isNaN(d) ? s : d.toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
const prio = (p) => `<span class="prio ${esc(p)}">${esc(String(p).toUpperCase())}</span>`;

// ---------- очередь ----------
async function loadQueue(keep = true) {
  const p = new URLSearchParams({ status: state.status });
  const q = $("#search").value.trim();
  if (q) p.set("q", q);
  const data = await api(`/api/admin/queue?${p}`);
  state.items = data.items;
  $("#queueCount").textContent = data.stats.queue.new || "";
  renderQueue();
  if (!keep || !state.items.some((i) => i.id === state.selected)) {
    if (state.items.length) select(state.items[0].id);
    else { state.selected = null; $("#detail").innerHTML = `<div class="empty">${state.status === "new" ? "Новых обращений нет" : "Пока ничего не обработано"}</div>`; }
  }
}

function renderQueue() {
  $("#queue").innerHTML = state.items.length ? state.items.map((i) => `
    <div class="item ${i.id === state.selected ? "selected" : ""}" data-id="${esc(i.id)}">
      <div class="row1">${prio(i.priority)}<span class="cat">${esc(state.catTitle[i.category] || i.category)}</span><span class="time">${esc(when(i.created_at))}</span></div>
      <div class="row2">${esc(i.snippet || "без текста")}</div>
      ${i.is_duplicate ? '<div class="note dup">дубль</div>' : !i.needs_human ? '<div class="note ok">можно отправить сразу</div>' : ""}
    </div>`).join("") : '<div class="empty">Ничего не найдено</div>';
}

async function select(id) {
  state.selected = id;
  renderQueue();
  state.ticket = await api(`/api/admin/tickets/${encodeURIComponent(id)}`);
  renderDetail();
}

// ---------- карточка ----------
function renderDetail() {
  const t = state.ticket, r = t.result, m = t.meta || {}, req = t.request, ev = m.evidence || {};
  const done = t.status !== "new";
  const lastText = done && t.feedback.length ? t.feedback.at(-1).final_text : r.draft_reply.text;
  const facts = [KIND[t.kind], when(t.created_at), r.lang,
    r.extracted.nickname && `обвиняемый ${r.extracted.nickname}`,
    req.images_count ? `скриншотов: ${req.images_count}` : null,
    r.extracted.rule_refs.length ? `игрок указал ${r.extracted.rule_refs.join(", ")}` : null].filter(Boolean);
  const msgs = (req.messages || []).filter((x) => x.role !== "admin").map((x) =>
    `<div class="quote">${x.role === "reported_player" ? '<span class="who">Ответ обвиняемого</span>' : ""}${esc(x.text)}</div>`).join("");
  const status = { sent: "Отправлено", escalated: "Эскалировано" }[t.status];
  const cats = state.meta.categories.filter((c) => c.kind === t.kind);

  $("#detail").innerHTML = `<div class="sheet">
    <h2>${esc(state.catTitle[t.category] || t.category)} ${prio(t.priority)}${status ? `<span class="hint">${status}</span>` : ""}</h2>
    <div class="sub">${facts.map(esc).join(" · ")}${done ? "" : ' · <button class="link" id="editDecision">изменить категорию</button>'}</div>
    <div class="edit-decision" id="decisionBox" hidden>
      <select id="dCategory">${cats.map((c) => `<option value="${esc(c.code)}" ${c.code === t.category ? "selected" : ""}>${esc(c.title)}</option>`).join("")}</select>
      <select id="dPriority">${state.meta.priorities.map((p) => `<option value="${p}" ${p === t.priority ? "selected" : ""}>${p.toUpperCase()}</option>`).join("")}</select>
    </div>

    <section class="block">
      <div class="label">Обращение</div>
      ${msgs || '<div class="hint">Текста нет</div>'}
    </section>

    <section class="block">
      <div class="label">Ответ игроку${r.needs_human ? "" : " — можно отправить без проверки"}</div>
      <textarea id="draft" ${done ? "disabled" : ""}>${esc(lastText)}</textarea>
      <div class="refs" id="refs"></div>
      <div class="warn" id="warn"></div>
      ${done ? "" : `
      <div class="actions">
        <button class="btn primary" id="send">Отправить</button>
        <button class="link" id="escalate">Эскалировать</button>
        <button class="link" id="reset" hidden>Вернуть черновик</button>
        <span class="spacer"></span><span class="hint">Ctrl+Enter — отправить</span>
      </div>
      <div class="escalate" id="escalateBox" hidden>
        <input type="text" id="comment" placeholder="Кому и почему передать">
        <button class="btn" id="escalateGo">Передать</button>
      </div>`}
    </section>

    <section class="block">
      <div class="label">На чём основан ответ</div>
      <div class="evidence">${renderEvidence(ev)}</div>
    </section>

    <section class="block">
      <details><summary>Почему сервис так решил</summary><ul class="plain">${r.reasons.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></details>
    </section>
    ${t.reference_answer ? `<section class="block"><details><summary>Реальный ответ админа из выгрузки (для сравнения)</summary><div class="quote">${esc(t.reference_answer)}</div></details></section>` : ""}
    ${t.feedback.length ? `<section class="block"><div class="label">История</div><ul class="plain">${t.feedback.map((f) => `<li>${esc(when(f.created_at))} — ${f.action === "send" ? (f.edited ? "отправлено с правкой" : "отправлено как есть") : "эскалировано"}${f.final_category !== f.model_category ? `, категория исправлена` : ""}${f.comment ? `: «${esc(f.comment)}»` : ""}</li>`).join("")}</ul></section>` : ""}
  </div>`;

  renderRefs(t.cited_rules || [], []);
  bindRuleToggles(ev);
  if (done) return;
  const draft = $("#draft");
  let timer;
  draft.addEventListener("input", () => {
    const edited = draft.value.trim() !== r.draft_reply.text.trim();
    draft.classList.toggle("edited", edited);
    $("#send").textContent = edited ? "Отправить с правкой" : "Отправить";
    $("#reset").hidden = !edited;
    clearTimeout(timer);
    timer = setTimeout(checkDraft, 350);
  });
  $("#reset").onclick = () => { draft.value = r.draft_reply.text; draft.dispatchEvent(new Event("input")); };
  $("#send").onclick = () => act("send");
  $("#escalate").onclick = () => { $("#escalateBox").hidden = false; $("#comment").focus(); };
  $("#escalateGo").onclick = () => act("escalate");
  $("#comment").addEventListener("keydown", (e) => { if (e.key === "Enter") act("escalate"); });
  $("#editDecision").onclick = () => { $("#decisionBox").hidden = !$("#decisionBox").hidden; };
}

function renderEvidence(ev) {
  // показываем то, что в ответе, подходит к категории или почти так же близко, как лучший пункт
  const top = Math.max(0, ...(ev.rules || []).map((h) => h.score));
  ev.rules = (ev.rules || []).filter((h) => h.cited || h.fits_category || (h.score >= 0.7 * top && h.score >= 0.2));
  const rules = ev.rules, terms = Object.entries(ev.terms || {}), ex = ev.examples || [];
  const parts = [];
  parts.push(`<div class="part"><div class="label">Найденные пункты правил</div>${rules.length ? rules.map((h, i) => `
    <div class="rule-row"><button class="ref" data-rule="${i}">${esc(h.id)}</button><span class="why">${esc(h.short)}</span>
      <span class="tag ${h.cited ? "" : "off"}">${h.cited ? "в ответе" : h.fits_category ? "подходит к категории" : ""}</span></div>
    <div class="rule-text" id="ruleText${i}" hidden></div>`).join("") : '<div class="hint">Ничего не найдено</div>'}</div>`);
  if (terms.length) parts.push(`<div class="part"><div class="label">Термины из правил</div>${terms.map(([k, v]) => `<div class="example"><b>${esc(k)}</b> — ${esc(v)}</div>`).join("")}</div>`);
  if (ex.length) parts.push(`<div class="part"><div class="label">Как админы отвечали на похожие обращения</div>${ex.map((e) => `
    <div class="example"><span class="q">«${esc(e.player)}»</span> → ${esc(e.admin)}</div>`).join("")}</div>`);
  return parts.join("");
}

const ruleText = (id) => api(`/api/admin/rules/${encodeURIComponent(id)}`).then((r) => r.text).catch(() => "");

function bindRuleToggles(ev) {
  document.querySelectorAll("[data-rule]").forEach((b) => b.onclick = async () => {
    const box = $(`#ruleText${b.dataset.rule}`);
    if (!box.hidden) { box.hidden = true; return; }
    box.textContent = await ruleText(ev.rules[+b.dataset.rule].id);
    box.hidden = false;
  });
}

function renderRefs(rules, problems) {
  $("#refs").innerHTML = (rules.length
    ? "Ссылки в ответе: " + rules.map((x, i) => `<button class="ref" data-cited="${i}">${esc(x.id)}</button>`).join(", ")
    : "В ответе нет ссылок на правила") + '<div class="rule-text" id="citedText" hidden></div>';
  $("#warn").textContent = problems.length ? "Проверьте ссылки: " + problems.join("; ") : "";
  document.querySelectorAll("[data-cited]").forEach((b) => b.onclick = async () => {
    const box = $("#citedText");
    box.textContent = await ruleText(rules[+b.dataset.cited].id);
    box.hidden = false;
  });
}

async function checkDraft() {
  const res = await api("/api/admin/check", { method: "POST", body: JSON.stringify({ text: $("#draft").value }) });
  renderRefs(res.rules, res.problems);
}

async function act(action) {
  const body = { action, text: $("#draft").value, comment: action === "escalate" ? $("#comment").value.trim() : null };
  if (!$("#decisionBox").hidden) { body.category = $("#dCategory").value; body.priority = $("#dPriority").value; }
  if (action === "escalate" && !body.comment) { toast("Напишите, кому и почему"); $("#comment").focus(); return; }
  try {
    await api(`/api/admin/tickets/${encodeURIComponent(state.selected)}/action`, { method: "POST", body: JSON.stringify(body) });
  } catch (e) { toast(e.message); return; }
  toast(action === "send" ? "Отправлено" : "Передано");
  const idx = state.items.findIndex((i) => i.id === state.selected);
  const next = state.items[idx + 1] || state.items[idx - 1];
  state.selected = next ? next.id : null;
  await loadQueue(true);
  if (state.selected) select(state.selected);
}

// ---------- шаблоны ----------
const SITUATION_RU = {
  report_question: "«вопрос передан администратору»", report_help: "«запрос передан администратору»",
  report_complaint: "«сообщение передано администратору»", report_offtopic: "«уточните вопрос»",
  complaint_review: "«жалоба принята к проверке»",
};
let tplItems = [];

async function loadTemplates() {
  const data = await api("/api/admin/templates");
  tplItems = data.items;
  const open = tplItems.filter((s) => s.status === "new").length;
  $("#tplCount").textContent = open || "";
  $("#tplIntro").textContent = tplItems.length
    ? "Группы похожих обращений, на которые админы отвечают одинаково, а сервис — общей фразой. Принятый шаблон сервис сразу использует для таких обращений."
    : "Предложений пока нет — запустите make templates.";
  $("#tplList").innerHTML = tplItems.map((s, i) => `
    <div class="tpl" data-i="${i}">
      <h3>${esc(s.examples[0] ? `«${s.examples[0]}» и похожие` : s.id)}</h3>
      <div class="stat">${s.size} обращений · ${Math.round(100 * s.answer_share)}% админов отвечают одинаково
        ${s.status === "accepted" ? ' · <span class="status-accepted">используется</span>' : s.status === "rejected" ? ' · <span class="status-rejected">отклонён</span>' : ""}</div>
      <div class="said">Ещё пишут: ${s.examples.slice(1, 3).map((e) => `<q>${esc(e)}</q>`).join(", ")}</div>
      <div class="said">Админы отвечают: <q>${esc(s.admin_answer)}</q>. Сервис сейчас: ${esc(SITUATION_RU[s.top_situation] || s.top_situation)}.</div>
      <textarea>${esc(s.accepted_text || s.proposed_text)}</textarea>
      <div class="warn"></div>
      <div class="actions">
        <button class="btn primary" data-act="accepted">${s.status === "accepted" ? "Сохранить" : "Использовать"}</button>
        ${s.status === "rejected" ? "" : '<button class="link" data-act="rejected">Не нужен</button>'}
      </div>
    </div>`).join("");
}

$("#tplList").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const card = b.closest(".tpl"), s = tplItems[+card.dataset.i];
  try {
    await api(`/api/admin/templates/${encodeURIComponent(s.cluster)}/decision`, {
      method: "POST", body: JSON.stringify({ status: b.dataset.act, text: $("textarea", card).value }),
    });
    toast(b.dataset.act === "accepted" ? "Шаблон используется" : "Скрыто");
    loadTemplates();
  } catch (err) { $(".warn", card).textContent = err.message; }
});

// ---------- новое обращение ----------
$("#newTicketBtn").onclick = () => { $("#newTicket").showModal(); $("#ntText").focus(); };
$("#ntCancel").onclick = () => $("#newTicket").close();
$("#kindPick").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  state.kind = b.dataset.kind;
  document.querySelectorAll("#kindPick button").forEach((x) => x.classList.toggle("active", x === b));
  $("#complaintFields").hidden = state.kind !== "complaint";
});
$("#newTicketForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("#ntText").value.trim(); if (!text) return;
  const body = { kind: state.kind, created_at: new Date().toISOString().slice(0, 19), reporter_hash: "demo-player",
    messages: [{ role: "player", text }] };
  if (state.kind === "complaint") {
    body.reported_nick = $("#ntNick").value.trim() || null;
    body.images_count = +$("#ntImages").value || 0;
  }
  try {
    const t = await api("/api/admin/tickets", { method: "POST", body: JSON.stringify(body) });
    $("#newTicket").close(); $("#ntText").value = "";
    showView("queue");
    state.status = "new";
    document.querySelectorAll("#statusFilter button").forEach((x) => x.classList.toggle("active", x.dataset.status === "new"));
    await loadQueue(true);
    select(t.id);
  } catch (err) { toast(err.message); }
});

// ---------- навигация ----------
function showView(view) {
  document.querySelectorAll("#nav button").forEach((x) => x.classList.toggle("active", x.dataset.view === view));
  $("#queueView").hidden = view !== "queue";
  $("#templatesView").hidden = view !== "templates";
  if (view === "templates") loadTemplates();
}
$("#nav").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) showView(b.dataset.view); });
$("#statusFilter").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#statusFilter button").forEach((x) => x.classList.toggle("active", x === b));
  state.status = b.dataset.status; loadQueue(false);
});
$("#queue").addEventListener("click", (e) => { const it = e.target.closest(".item"); if (it) select(it.dataset.id); });
let qTimer; $("#search").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(() => loadQueue(false), 300); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && $("#send") && !$("#queueView").hidden) { e.preventDefault(); act("send"); }
});

(async () => {
  state.meta = await api("/api/admin/meta");
  state.meta.categories.forEach((c) => state.catTitle[c.code] = c.title);
  loadQueue(false);
  api("/api/admin/templates").then((d) => { $("#tplCount").textContent = d.items.filter((s) => s.status === "new").length || ""; }).catch(() => {});
})();
</script>
</body>
